[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drt-screen-creator"
version = "1.2.1"
description = "Outil local de captures prédéfinies et libres pour Dofus Retro Tools"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PySide6==6.8.3",
  "mss>=10,<11",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.12,<7",
]

[project.scripts]
drt-screen-creator = "drt_screen_creator.app:main"

[tool.setuptools.packages.find]
include = ["drt_screen_creator*"]

[tool.setuptools.package-data]
drt_screen_creator = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
